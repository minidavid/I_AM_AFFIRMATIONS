<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>mail us :)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="mail.css">
        <link rel="stylesheet" href="my_header.css">
        <link rel="stylesheet" href="my_footer.css">
        <link rel="stylesheet" href="email_button.css">
        <link rel="stylesheet" href="style.css">

        <script src="my_header.js" defer></script>
        <script src="my_footer.js" defer></script>
    </head>

    <body>
        <!-- header -->
        <my-js-header></my-js-header>

        <h1 style="margin-top: 10%; margin-left: 5%;">Comments? Complaints? Commends?</h1>
        <p style="margin-top: 5%; margin-left: 5%;">Email us!</p>

        <!--Last Part of Page-->
        <div class="formA">
            <form id="myForm">
                <input type="text" name="_honey" style="display:none">

                <label for="fname" style="color: rgb(0, 0, 0);">Your name:</label><br><br>
                <input type="text" class="txtname" id="fname" placeholder="name goes here" name="name" required/><br><br>

                <label for="email" style="color: rgb(0, 0, 0);">Email:</label><br><br>
                <input class="txtemail" type="email" id="email" placeholder="myemail@email.com" name="email" required/><br><br>

                <label for="message" style="color: rgb(0, 0, 0);">Content:</label><br><br>
                <textarea id="message" name="message" rows="5" placeholder="Dear sir/madam,&#10;&#10;Your Message...&#10;&#10;Regards,&#10;Your name." required></textarea><br><br>

                <button class="cool" type="submit" id="submitBtn">Send Email</button><br>
            </form>
        </div>

        <!--footer-->
        <my-js-footer></my-js-footer>

        <script>
            const form = document.getElementById('myForm');
            const submitBtn = document.getElementById('submitBtn');

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const formData = new FormData(form);
                const name = formData.get("name").trim();
                const email = formData.get("email").trim();
                const message = formData.get("message").trim();
                const honey = formData.get("_honey");

                if (name === "") {
                    alert("Add your name please :)");
                    return;
                }
                if (email === "") {
                    alert("Forgot the email address :(");
                    return;
                }
                if (message === "") {
                    alert("Add your message please :)");
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Sending...";

                fetch("https://formsubmit.co", {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        message: message,
                        _honey: honey,
                        _captcha: "false",
                        _subject: `New website message from ${name}`
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success === "true" || data.success === true) {
                        alert("Sent!");
                        form.reset();
                    } else {
                        alert("Something went wrong. Please try again.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Failed to send email. Check your connection.");
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Send Email";
                });
            });
        </script>
    </body>
</html>
