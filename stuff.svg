<svg
                    width="255px"
                    height="255px"
                    viewBox="0 0 255 255"
                    style= "padding: 10% 1% 10% 1%;"
                    xmlns="http://www.w3.org/2000/svg">


                    <style>
                        .small {
                        font: italic 60px sans-serif;
                        fill: white;
                        }
                    
                    </style>    

                    <filter id="displacementFilter">
                        <feTurbulence
                        type="turbulence"
                        baseFrequency="1.0"
                        numOctaves="16"
                        result="turbulence" />
                        <feDisplacementMap
                        in2="turbulence"
                        in="SourceGraphic"
                        scale="10"
                        xChannelSelector="R"
                        yChannelSelector="G" />
                    </filter>

                    <!-- <foreignObject width="100%" height="100%">
                        <video width="100%" height="100%" autoplay muted loop playsinline>
                            <source src="ok2.mp4" type="video/mp4">support zii</video>
                        </video>
                    </foreignObject> -->

                    <circle cx="30%" cy="40%" r="30%" fill="#000" opacity="0.5" filter="url(#displacementFilter)">

                        <animate
                            attributeName = "r"
                            begin = "0s"
                            dur="8s"
                            from="0"
                            to="30%"                        
                        />

                    </circle>
                    <circle cx="40%" cy="70%" r="15%" fill="red" opacity="0.5" filter="url(#displacementFilter)">

                        <animate
                            attributeName = "r"
                            begin = "0s"
                            dur="5s"
                            from="0"
                            to="15%"                        
                        />

                    </circle>
                    <circle cx="70%" cy="50%" r="10%" fill="blue" opacity="0.5" filter="url(#displacementFilter)">
        

                        <animate 
                            attributeName = "r"
                            begin = "0s"
                            dur="2s"
                            from="0"
                            to="10%"
                        />
                    </circle>


                </svg>